  <!-- Interactive Wave Grid Canvas Script -->
  <script>
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Cosmic Grid Wave Parameters
    let step = 0;
    const gridCols = 40;
    const gridRows = 30;

    function drawWaveGrid() {
      ctx.clearRect(0, 0, width, height);

      step += 0.015;

      // Deep ocean space gradient background overlay
      const bgGrad = ctx.createLinearGradient(0, 0, width, height);
      bgGrad.addColorStop(0, 'rgba(5, 5, 8, 0.92)');
      bgGrad.addColorStop(0.5, 'rgba(10, 5, 20, 0.88)');
      bgGrad.addColorStop(1, 'rgba(3, 12, 22, 0.94)');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, width, height);

      // Grid Perspective simulation
      const horizonY = height * 0.45;
      const cellWidth = width / gridCols;

      ctx.lineWidth = 1;

      // Draw Horizontal Wavy Lines
      for (let r = 0; r < gridRows; r++) {
        const progress = r / gridRows;
        const yBase = horizonY + Math.pow(progress, 2.2) * (height - horizonY);

        ctx.beginPath();
        const lineGrad = ctx.createLinearGradient(0, yBase, width, yBase);
        lineGrad.addColorStop(0, 'rgba(155, 0, 255, ' + (progress * 0.25) + ')');
        lineGrad.addColorStop(0.5, 'rgba(56, 255, 0, ' + (progress * 0.4) + ')');
        lineGrad.addColorStop(1, 'rgba(155, 0, 255, ' + (progress * 0.25) + ')');
        ctx.strokeStyle = lineGrad;

        for (let c = 0; c <= gridCols; c++) {
          const x = c * cellWidth;
          // Wave amplitude increases towards the bottom
          const wave = Math.sin(step + c * 0.3 + r * 0.4) * (8 * progress);
          const y = yBase + wave;

          if (c === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      // Draw Perspective Vertical Lines
      for (let c = 0; c <= gridCols; c++) {
        const topX = (c - gridCols / 2) * (cellWidth * 0.2) + width / 2;
        const botX = c * cellWidth;

        ctx.beginPath();
        ctx.strokeStyle = 'rgba(155, 0, 255, 0.12)';
        ctx.moveTo(topX, horizonY);
        ctx.lineTo(botX, height);
        ctx.stroke();
      }

      // Draw Floating Cosmic Particles
      for (let i = 0; i < 25; i++) {
        const px = (Math.sin(step * 0.5 + i * 99) * 0.5 + 0.5) * width;
        const py = (Math.cos(step * 0.3 + i * 33) * 0.5 + 0.5) * height;
        const size = Math.sin(step + i) * 1.5 + 2;

        ctx.fillStyle = i % 2 === 0 ? 'rgba(56, 255, 0, 0.6)' : 'rgba(155, 0, 255, 0.6)';
        ctx.beginPath();
        ctx.arc(px, py, size, 0, Math.PI * 2);
        ctx.fill();
      }

      requestAnimationFrame(drawWaveGrid);
    }

    drawWaveGrid();
  </script>

                <div className="grid grid-cols-2 gap-4 pt-4">
                  <div className="glass-card p-4 rounded-xl border-l-2 border-neon">
                    <h3 className="font-display text-lg font-bold text-white">Estrategia + Arte</h3>
                    <p className="text-xs text-gray-400 mt-1">Branding, Rebranding y Sistemas Visuales escalables.</p>
                  </div>
                  <div className="glass-card p-4 rounded-xl border-l-2 border-violetCustom">
                    <h3 className="font-display text-lg font-bold text-white">Diseño Editorial</h3>
                    <p className="text-xs text-gray-400 mt-1">Maquetación de libros, revistas, catálogos y piezas impresas.</p>

                <h2 className="font-display text-3xl sm:text-5xl font-extrabold uppercase tracking-tight">
                  Proyectos <span className="text-neon">Destacados</span>
                </h2>
                <p className="text-gray-400 mt-4 text-sm sm:text-base">
                  Explora nuestros trabajos clasificados por áreas de especialidad visual.
                </p>

              {/* Category Filter Buttons */}
              <div className="flex flex-wrap justify-center gap-2 sm:gap-4 mb-12">
                {[
                  { id: 'all', label: 'Todos' },
                  { id: 'logos', label: 'Logos' },
                  { id: 'branding', label: 'Identidad Visual & Branding' },
                  { id: 'rebranding', label: 'Rebranding' },
                  { id: 'editorial', label: 'Editorial' },
                  { id: 'extras', label: 'Extras' }
                ].map(cat => (
                  <button
                    key={cat.id}
                    onClick={() => setActiveCategory(cat.id)}
                    className={`px-5 py-2.5 rounded-full text-xs font-bold uppercase tracking-wider transition-all duration-300 ${
                      activeCategory === cat.id
                        ? 'bg-neon text-black shadow-neon-glow'
                        : 'glass-card text-gray-300 hover:text-white hover:border-neon/50'
                    }`}
                  >
                    {cat.label}
                  </button>
                ))}

                    key={project.id}

                    className="glass-card rounded-2xl overflow-hidden group cursor-pointer border border-white/10 hover:border-neon/60 transition-all duration-500 flex flex-col justify-between"
                  >
                    <div className="relative aspect-video overflow-hidden bg-black/60">
                      <img 
                        src={project.image} 
                        alt={project.title}
                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700"
                        loading="lazy"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-darkBg via-transparent to-transparent opacity-60"></div>
                      <span className="absolute top-4 left-4 px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-black/80 text-neon border border-neon/30">
                        {project.categoryLabel}
                      </span>
                    </div>

                    <div className="p-6">
                      <h3 className="font-display text-xl font-bold text-white group-hover:text-neon transition-colors">
                        {project.title}
                      </h3>
                      <p className="text-gray-400 text-xs mt-2 line-clamp-2">
                        {project.description}
                      </p>
                      <div className="flex flex-wrap gap-2 mt-4">
                        {project.tags.map((t, idx) => (
                          <span key={idx} className="text-[10px] uppercase font-semibold px-2 py-0.5 rounded bg-white/5 text-gray-300">
                            #{t}

                    </div>

              </div>

            </div>

                <span className="text-violetCustom font-mono text-xs tracking-widest uppercase">METODOLOGÍA DE TRABAJO</span>
                <h2 className="font-display text-3xl sm:text-5xl font-extrabold uppercase mt-2">

                </h2>
                <p className="text-gray-400 text-sm mt-3">

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 relative">
                {CREATIVE_PROCESS.map((proc, index) => (

                      <span className="font-display text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-neon to-violetCustom">
                        {proc.step}
                      </span>
                      <i data-lucide="sparkles" className="w-5 h-5 text-neon"></i>
                    </div>
                    <h3 className="font-display text-xl font-bold text-white mb-2">{proc.title}</h3>
                    <p className="text-gray-400 text-xs leading-relaxed">{proc.desc}</p>

            </div>

            <div className="max-w-6xl mx-auto">
              <div className="text-center mb-16">
                <h2 className="font-display text-3xl sm:text-4xl font-extrabold uppercase">

                </h2>
                <p className="text-gray-400 text-sm mt-2">Experiencias de clientes e instituciones que han potenciado su marca con OUSIA.</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div className="glass-card p-8 rounded-2xl border border-white/10 flex flex-col justify-between">
                  <p className="text-gray-300 italic text-sm leading-relaxed mb-6">
                    “Alexander captó inmediatamente la esencia de lo que necesitábamos. El rebranding de nuestra empresa no solo mejoró nuestra imagen corporativa, sino que elevó nuestra percepción en el mercado internacional.”
                  </p>
                  <div className="flex items-center space-x-4">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-br from-neon to-violetCustom flex items-center justify-center font-bold text-black font-display">
                      CM
                    </div>
                    <div>
                      <h3 className="font-display font-bold text-white text-sm">Cliente Confidencial</h3>
                      <p className="text-xs text-neon">Director de Marca & Innovación</p>
                    </div>
                  </div>
                </div>

                <div className="glass-card p-8 rounded-2xl border border-white/10 flex flex-col justify-between">
                  <p className="text-gray-300 italic text-sm leading-relaxed mb-6">
                    “El nivel de detalle, la fundamentación teórica y la precisión en los manuales de marca entregados por OUSIA superaron todas nuestras expectativas. Altamente recomendado en Uruguay.”

                  <div className="flex items-center space-x-4">
                    <div className="w-12 h-12 rounded-full bg-gradient-to-br from-violetCustom to-neon flex items-center justify-center font-bold text-black font-display">
                      RS
                    </div>
                    <div>
                      <h3 className="font-display font-bold text-white text-sm">Startup Tecnológica</h3>
                      <p className="text-xs text-violetCustom">Fundador & CEO</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

              <div className="inline-block px-4 py-1.5 rounded-full border border-neon/50 bg-neon/10 text-neon text-xs font-semibold uppercase tracking-widest">
                INICIA UN PROYECTO
              </div>

              <h2 className="font-display text-3xl sm:text-6xl font-extrabold uppercase tracking-tight leading-tight">

              <p className="text-gray-300 text-base sm:text-xl max-w-2xl mx-auto font-light">

              <div>
                <a

                  target="_blank"
                  rel="noopener noreferrer"
                  className="inline-flex items-center gap-3 px-10 py-5 rounded-full bg-neon text-black font-extrabold text-sm uppercase tracking-widest hover:bg-white transition-all shadow-neon-glow transform hover:-translate-y-1"
                >
                  <i data-lucide="message-circle" className="w-5 h-5"></i>
                  Enviar Mensaje directo por WhatsApp
                </a>
              </div>

              {/* Social Channels */}
              <div className="pt-8 flex flex-wrap justify-center items-center gap-6 text-sm text-gray-400">
                <a href="https://instagram.com/ousia_design" target="_blank" rel="noopener noreferrer" className="flex items-center space-x-2 hover:text-neon transition-colors">
                  <i data-lucide="instagram" className="w-5 h-5"></i>
                  <span>@ousia_design</span>
                </a>
                <a href="https://instagram.com/alexandersilveiraq" target="_blank" rel="noopener noreferrer" className="flex items-center space-x-2 hover:text-neon transition-colors">
                  <i data-lucide="instagram" className="w-5 h-5"></i>
                  <span>@alexandersilveiraq</span>
                </a>
                <a href="mailto:ousiaousia@gmail.com" className="flex items-center space-x-2 hover:text-neon transition-colors">
                  <i data-lucide="mail" className="w-5 h-5"></i>
                  <span>ousiaousia@gmail.com</span>
                </a>
                <span className="flex items-center space-x-2">
                  <i data-lucide="phone" className="w-5 h-5 text-neon"></i>
                  <span>+598 92 705 850</span>
                </span>
              </div>

            </div>
          </section>

          {/* FOOTER */}
          <footer className="border-t border-white/10 py-10 px-6 glass-card text-xs text-gray-500">
            <div className="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
              <div>
                <span className="font-display font-bold text-white tracking-widest text-base">OUSIA</span>
                <span className="ml-2 text-gray-400">— Alexander Silveira | Diseño Gráfico & Comunicación Visual</span>
              </div>
              <div>
                © {new Date().getFullYear()} OUSIA Studio. Todos los derechos reservados. Uruguay.
              </div>
            </div>
          </footer>

          {/* PROJECT EXPANDED MODAL */}
          {selectedProject && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
              <div className="glass-card max-w-3xl w-full max-h-[90vh] overflow-y-auto rounded-2xl border border-white/20 p-6 relative">
                
                <button 
                  onClick={() => setSelectedProject(null)}
                  className="absolute top-4 right-4 text-gray-400 hover:text-white p-2 rounded-full bg-black/50"
                >
                  <i data-lucide="x" className="w-6 h-6"></i>
                </button>

                <span className="px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-neon text-black">
                  {selectedProject.categoryLabel}
                </span>

                <h3 className="font-display text-2xl sm:text-3xl font-bold text-white mt-4">
                  {selectedProject.title}
                </h3>

                {selectedProject.beforeImage ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 my-6">
                    <div>
                      <p className="text-xs font-bold text-red-400 uppercase mb-2">Antes</p>
                      <img src={selectedProject.beforeImage} className="rounded-xl w-full aspect-video object-cover" />
                    </div>
                    <div>
                      <p className="text-xs font-bold text-neon uppercase mb-2">Después (OUSIA Redesign)</p>
                      <img src={selectedProject.image} className="rounded-xl w-full aspect-video object-cover" />
                    </div>
                  </div>
                ) : (
                  <img 
                    src={selectedProject.image} 
                    alt={selectedProject.title}
                    className="w-full h-auto rounded-xl my-6 border border-white/10"
                  />
                )}

                <p className="text-gray-300 text-sm leading-relaxed">
                  {selectedProject.description}
                </p>

                <div className="flex flex-wrap gap-2 mt-6">
                  {selectedProject.tags.map((t, idx) => (
                    <span key={idx} className="text-xs uppercase font-semibold px-3 py-1 rounded-full bg-white/10 text-neon">
                      #{t}
                    </span>
                  ))}
                </div>

                <div className="mt-8 pt-4 border-t border-white/10 flex justify-end">
                  <button
                    onClick={() => setSelectedProject(null)}
                    className="px-6 py-2 rounded-full bg-white text-black font-bold text-xs uppercase"
                  >
                    Cerrar Vista
                  </button>
                </div>

              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
